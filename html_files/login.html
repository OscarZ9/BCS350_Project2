<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href = "../StyleandLogic/style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
<div id="loginCard">
    <h1>My Quiz App</h1>
    <form action="../php/login.php" method="POST">
        <input type="text" placeholder="Email" name="email">
        <input type="password" placeholder="Password" name="password">
        <button type="submit">Log in</button>
    </form>
    <button type="button" onclick="window.location.href='../html_files/signup.html'">Sign Up</button>
    <p id="errorMsg"></p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
        document.getElementById("errorMsg").innerHTML = "Invalid email or password.";
    }
</script>

</body>
</html>
